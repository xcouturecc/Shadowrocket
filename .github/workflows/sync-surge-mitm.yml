name: Sync Surge MITM hostnames
on:
  schedule:
    - cron: '55 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-surge-mitm
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python Surge/scripts/sync-mitm.py
      - name: Commit hostname updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Surge/Modules/sukka_mitm_hostnames.sgmodule
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream Surge MITM hostnames"
            git pull --rebase origin master
            git push
          fi
