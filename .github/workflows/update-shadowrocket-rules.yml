name: Update Shadowrocket rules

on:
  schedule:
    # Run after the daily upstream sync. Shared concurrency prevents overlap.
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-maintenance-master
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'xcouturecc/Shadowrocket'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install pinned Mihomo ruleset converter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.19.31 --repo MetaCubeX/mihomo \
            --pattern mihomo-linux-amd64-v1.19.31.gz --dir /tmp --clobber
          echo 'd5e74bbddbdfff49a1aef7775bf5911da59f0d7196ed509a0ac914b3653dd5f1  /tmp/mihomo-linux-amd64-v1.19.31.gz' | sha256sum -c -
          gzip -dc /tmp/mihomo-linux-amd64-v1.19.31.gz > /tmp/mihomo-ruleset
          chmod +x /tmp/mihomo-ruleset

      - name: Convert Sukka rules for Shadowrocket
        run: node Shadowrocket/scripts/update-rules.mjs

      - name: Compile Mihomo rule providers
        env:
          MIHOMO_BIN: /tmp/mihomo-ruleset
        run: node Shadowrocket/scripts/update-clash-mrs.mjs

      - name: Validate profile order and provider files
        run: node Shadowrocket/scripts/validate-profiles.mjs

      - name: Commit updated rules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Shadowrocket/Rules Shadowrocket/Clash/rules

          if git diff --cached --quiet; then
            echo "Shadowrocket rules are already up to date."
            exit 0
          fi

          git commit -m "Update converted Shadowrocket rules"
          git push origin master
