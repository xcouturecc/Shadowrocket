mixed-port: 7890
allow-lan: false
mode: rule
ipv6: true
log-level: info
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  # DoH IP endpoints bootstrap resolver hostnames without plaintext DNS.
  default-nameserver: [https://223.5.5.5/dns-query, https://223.6.6.6/dns-query]
  # Overseas/default names resolve through the selected proxy.
  nameserver: [https://1.1.1.1/dns-query#PROXY, https://1.0.0.1/dns-query#PROXY]
  # Resolve DIRECT destinations without depending on the selected proxy node.
  direct-nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  direct-nameserver-follow-policy: false
  proxy-server-nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  nameserver-policy:
    "geosite:cn": [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
    "geosite:geolocation-!cn": [https://1.1.1.1/dns-query#PROXY, https://1.0.0.1/dns-query#PROXY]
  fake-ip-filter: ['*.lan', '*.local', 'localhost', '+.home.arpa', 'time.*.com']
proxies: []
proxy-groups:
  - name: PROXY
    type: select
    include-all: true
    proxies: [REJECT]
rule-providers:
