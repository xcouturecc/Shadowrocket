    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Clash/rules/ai_ip.mrs
    path: ./rules/ai_ip.mrs
    interval: 86400
  ai_non_ip:
