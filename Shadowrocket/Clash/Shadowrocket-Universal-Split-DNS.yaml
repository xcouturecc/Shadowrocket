rules:
  # Sukka README order; all domain rules precede IP rules.
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - RULE-SET,speedtest_domainset,PROXY
  - RULE-SET,cdn_domainset,PROXY
  - RULE-SET,cdn_non_ip,PROXY
  - RULE-SET,stream_non_ip,PROXY
  - RULE-SET,ai_non_ip,PROXY
  - RULE-SET,apple_intelligence_non_ip,PROXY
  - RULE-SET,telegram_non_ip,PROXY
  - RULE-SET,apple_cdn_domainset,DIRECT
  - RULE-SET,apple_services_non_ip,DIRECT
  - RULE-SET,apple_cn_non_ip,DIRECT
  - RULE-SET,microsoft_cdn_non_ip,DIRECT
  - RULE-SET,microsoft_non_ip,DIRECT
  - RULE-SET,neteasemusic_non_ip,DIRECT
  - RULE-SET,download_domainset,PROXY
  - RULE-SET,download_non_ip,PROXY
  - RULE-SET,lan_non_ip,DIRECT
  - RULE-SET,domestic_non_ip,DIRECT
  - RULE-SET,direct_non_ip,DIRECT
  - RULE-SET,global_non_ip,PROXY
  # IP rules follow every domain/non-IP provider.
  - RULE-SET,stream_ip,PROXY,no-resolve
  - RULE-SET,ai_ip,PROXY,no-resolve
  - RULE-SET,telegram_ip,PROXY,no-resolve
  - RULE-SET,apple_services_ip,DIRECT,no-resolve
  - RULE-SET,neteasemusic_ip,DIRECT,no-resolve
  - RULE-SET,lan_ip,DIRECT
  - RULE-SET,domestic_ip,DIRECT,no-resolve
  - RULE-SET,china_ip,DIRECT
  - RULE-SET,china_ip_ipv6,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
