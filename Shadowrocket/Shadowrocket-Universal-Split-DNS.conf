RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/neteasemusic_ip.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/lan_ip.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/domestic_ip.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/china_ip.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/china_ip_ipv6.list,DIRECT

