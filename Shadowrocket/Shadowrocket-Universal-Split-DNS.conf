RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/global_non_ip.list,PROXY

# IP 规则放在全部域名规则之后。
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/stream_ip.list,PROXY
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/ai_ip.list,PROXY
