RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/apple_services_non_ip.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/apple_cn_non_ip.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/microsoft_cdn_non_ip.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/microsoft_non_ip.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/neteasemusic_non_ip.list,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/download_domainset.list,PROXY
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/download_non_ip.list,PROXY
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/lan_non_ip.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/domestic_non_ip.list,DIRECT
