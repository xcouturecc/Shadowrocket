RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/apple_intelligence_non_ip.list,PROXY
RULE-SET,https://raw.githubusercontent.com/xcouturecc/Shadowrocket/master/Shadowrocket/Rules/telegram_non_ip.list,PROXY
