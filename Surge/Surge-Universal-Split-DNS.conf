# Surge Universal / SukkaW Ruleset
#
# Surge 官方文档：
# https://manual.nssurge.com/
#
# SukkaW Ruleset：
# https://github.com/SukkaW/Surge
#
# 设计原则：
# - 面向中国大陆常见网络环境，同时兼顾 Surge for iOS / macOS
# - 直接引用 SukkaW 上游规则，不复制规则内容，保持上游自动更新
# - 所有 DOMAIN / DOMAIN-SET / non_ip 规则必须位于所有 IP 类规则之前
# - 精准服务分流优先于 Apple / 国内 / Global 泛化规则，避免被提前吞掉
# - iOS / macOS 均加载 SukkaW 基础、Extra 和广告补充规则
# - URL 广告规则需配合本配置的 MITM 域名及设备本地可信 CA 证书
# - Common CDN 按 SukkaW 上游建议与 global.conf 使用相同的 PROXY 策略
# - Download 仅在有独立下载 / 低倍率策略时再启用
# - IPv6 已启用，因此同时加载 china_ip_ipv6
#
# 如果后续增加订阅节点，可直接将节点加入 PROXY，或单独加入 AI /
# Telegram / Streaming 策略组，无需改动规则区。

[General]
loglevel = notify

# IPv6
ipv6 = true
ipv6-vif = auto

# DNS
# 配置 encrypted-dns-server 后，传统 DNS 主要用于连通性检测，
# 以及解析加密 DNS 服务器 URL 中的域名。
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query

# 接管硬编码到 53 端口的 DNS 查询。
hijack-dns = *:53

# 当命中的代理策略不支持 UDP Relay 时直接拒绝，避免意外直连。
udp-policy-not-supported-behaviour = REJECT

# 使用 Surge 官方默认的按策略 QUIC 行为。
# QUIC 是否阻断由具体策略自身能力决定，不再全局强制所有代理回退 TCP。
block-quic = per-policy


[Proxy]
# 在这里填写你的 Surge 节点。


[Proxy Group]
# 添加节点后，将节点名称加入本策略组。
# 未添加节点前默认 REJECT，避免误直连。
PROXY = select, REJECT

# 默认继承 PROXY；以后如需指定不同落地，可直接把对应节点加入这些组。
AI = select, PROXY
Telegram = select, PROXY
Streaming = select, PROXY


[Rule]

# ============================================================
# 0. 自定义最高优先级 / Surge 系统流量
# ============================================================

# Apple Push Notification Service：
# 显式直连，避免推送长连接受代理切换影响。
DOMAIN-SUFFIX,push.apple.com,DIRECT
DOMAIN-SUFFIX,push-apple.com.akadns.net,DIRECT

# Surge 内置 SYSTEM 规则集。
# 当前包含多数 iOS/macOS 系统流量，也包含 APNs；显式 APNs 规则保留，
# 是为了即使未来 SYSTEM 内容变化，推送策略仍保持确定。
RULE-SET,SYSTEM,DIRECT


# ============================================================
# 1. DOMAIN-SET
# DOMAIN-SET / non_ip 必须全部位于 IP 类规则之前
# ============================================================

# iOS / macOS 广告拦截：
# 按维护者选择在移动端也启用；耗电与兼容性需实际观察。
# 基础广告域名 + Extra 补充；不默认启用 phishing，避免不必要的误拦截范围。
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject.conf,REJECT,extended-matching
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject_extra.conf,REJECT

# Speedtest：用于测试当前代理出口。
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/speedtest.conf,PROXY,extended-matching

# Common CDN：上游建议即使没有独立 CDN 节点也使用，并与 global.conf 分配相同策略。
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/cdn.conf,PROXY

# Apple 中国大陆 CDN。
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/apple_cdn.conf,DIRECT


# ============================================================
# 2. NON-IP：广告过滤 / 精准海外服务 / 独立策略
# ============================================================

# AdBlock：
# reject-drop 使用 pre-matching 提前丢弃适合直接静默丢弃的请求；
# reject-no-drop 保留显式拒绝语义。均不需要 MITM。
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-drop.conf,REJECT-DROP,pre-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject.conf,REJECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-no-drop.conf,REJECT-NO-DROP,extended-matching

# HTTPS URL 拦截需要在设备上安装并信任 Surge CA。
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-url-regex.conf,REJECT

# Common CDN
RULE-SET,https://ruleset.skk.moe/List/non_ip/cdn.conf,PROXY

# Streaming
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream.conf,Streaming

# AI：包含 OpenAI / Gemini / Claude / Perplexity 等。
RULE-SET,https://ruleset.skk.moe/List/non_ip/ai.conf,AI
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_intelligence.conf,AI,extended-matching

# Telegram
RULE-SET,https://ruleset.skk.moe/List/non_ip/telegram.conf,Telegram


# ============================================================
# 3. NON-IP：Apple / Microsoft / 国内 / 必须直连
# ============================================================

# Apple
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_services.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,DIRECT

# Microsoft
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft_cdn.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft.conf,DIRECT

# NetEase Music
RULE-SET,https://ruleset.skk.moe/List/non_ip/neteasemusic.conf,DIRECT

# LAN
RULE-SET,https://ruleset.skk.moe/List/non_ip/lan.conf,DIRECT

# Mainland China common services
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,DIRECT

# Services that should always connect directly
RULE-SET,https://ruleset.skk.moe/List/non_ip/direct.conf,DIRECT


# ============================================================
# 4. NON-IP：其他海外常用服务
# 必须位于 domestic / direct 之后
# ============================================================

RULE-SET,https://ruleset.skk.moe/List/non_ip/global.conf,PROXY


# ============================================================
# 5. IP RULE-SET
# 从这里开始才允许进入 IP 类匹配 / 本地 DNS 解析阶段
# ============================================================

# AdBlock IP 补充。
RULE-SET,https://ruleset.skk.moe/List/ip/reject.conf,REJECT-DROP

# Streaming
RULE-SET,https://ruleset.skk.moe/List/ip/stream.conf,Streaming

# AI
RULE-SET,https://ruleset.skk.moe/List/ip/ai.conf,AI

# Telegram
# 上游 CIDR 条目自身已按需要携带 no-resolve。
RULE-SET,https://ruleset.skk.moe/List/ip/telegram.conf,Telegram

# NetEase Music
RULE-SET,https://ruleset.skk.moe/List/ip/neteasemusic.conf,DIRECT

# LAN
RULE-SET,https://ruleset.skk.moe/List/ip/lan.conf,DIRECT

# Mainland China common services
RULE-SET,https://ruleset.skk.moe/List/ip/domestic.conf,DIRECT

# Mainland China IPv4 / IPv6
RULE-SET,https://ruleset.skk.moe/List/ip/china_ip.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/ip/china_ip_ipv6.conf,DIRECT


# ============================================================
# 6. FINAL
# 未被前述规则识别的流量全部交给代理。
# dns-failed 允许本地 DNS 匹配失败时仍交由代理远端处理。
# ============================================================

FINAL,PROXY,dns-failed


[Host]
# Surge 官方 Split DNS 写法示例：
# *.example.internal = server:10.0.0.53


[MITM]
# CA 证书由每台设备本地生成并信任，不在公共仓库保存。
enable = true
